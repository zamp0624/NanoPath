name: Deploy NanoPath to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Show repository files
        run: |
          pwd
          ls -la
          find . -name package.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./nanopath-web

      - name: Build NanoPath
        run: npm run build
        working-directory: ./nanopath-web

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./nanopath-web/dist

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
